name: Triage labels

# Labels new issues as core / integration (via Gemini).
# CUSTOM-HOOK ci-fork-scope: no automatic runs here. Upstream triggers on
# opened issues. The job guard skips this repository if it is dispatched.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  label:
    # CUSTOM-HOOK ci-fork-scope: labeling uses an upstream model key.
    if: github.repository == 'vectorize-io/hindsight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/triage-labels.py ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
