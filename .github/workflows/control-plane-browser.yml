name: Control plane browser check

# Manual only. This check also runs locally via `npm run test:browser`.
on:
  workflow_dispatch:

jobs:
  theme-loads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: hindsight-control-plane
      - run: npm run test:browser --workspace=@vectorize-io/hindsight-control-plane
